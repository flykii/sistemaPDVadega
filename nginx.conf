server {
    listen 80;
    server_name pdventerprise.cloud www.pdventerprise.cloud 2.25.233.126 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pdventerprise.cloud www.pdventerprise.cloud;

    ssl_certificate /etc/letsencrypt/live/pdventerprise.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdventerprise.cloud/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
