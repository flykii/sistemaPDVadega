{% extends 'base.html' %}

{% block title %}{% if fornecedor %}Editar Fornecedor{% else %}Novo Fornecedor{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-6">
        <div class="card card-custom p-4 shadow">
            <h3 class="fw-bold text-dark mb-3">
                <i class="bi bi-truck text-primary me-2"></i>
                {% if fornecedor %}Editar Fornecedor{% else %}Novo Fornecedor{% endif %}
            </h3>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="razao_social" class="form-label fw-bold">Razão Social</label>
                    <input type="text" name="razao_social" id="razao_social" class="form-control" value="{{ fornecedor.razao_social|default:'' }}" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="nome_fantasia" class="form-label fw-bold">Nome Fantasia</label>
                    <input type="text" name="nome_fantasia" id="nome_fantasia" class="form-control" value="{{ fornecedor.nome_fantasia|default:'' }}">
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="cnpj" class="form-label fw-bold">CNPJ</label>
                        <input type="text" name="cnpj" id="cnpj" class="form-control" value="{{ fornecedor.cnpj|default:'' }}">
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="telefone" class="form-label fw-bold">Telefone</label>
                        <input type="text" name="telefone" id="telefone" class="form-control" value="{{ fornecedor.telefone|default:'' }}">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <a href="{% url 'fornecedores_list' %}" class="btn btn-secondary w-50 py-2 fw-bold">Cancelar</a>
                    <button type="submit" class="btn btn-primary w-50 py-2 fw-bold"><i class="bi bi-save me-1"></i> Salvar Fornecedor</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
