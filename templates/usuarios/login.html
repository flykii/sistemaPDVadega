{% extends 'base.html' %}

{% block title %}Login - Sistema PDV Enterprise{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-80 my-5">
    <div class="col-12 col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow-lg border-0">
            <div class="text-center mb-4">
                <i class="bi bi-cart-check-fill text-primary display-4"></i>
                <h3 class="fw-bold mt-2 text-dark">PDV Web Enterprise</h3>
                <p class="text-muted small">Acesse com suas credenciais de usuário</p>
            </div>

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label font-weight-bold">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" id="username" class="form-control" placeholder="Digite seu usuário" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label font-weight-bold">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Digite sua senha" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Sistema
                </button>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="text-muted small mb-1">Ainda não possui uma empresa cadastrada?</p>
                    <a href="{% url 'cadastro_empresa' %}" class="btn btn-outline-secondary btn-sm w-100 fw-bold">
                        <i class="bi bi-building-add me-1"></i> Criar Nova Empresa
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
